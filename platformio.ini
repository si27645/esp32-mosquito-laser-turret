; ESP32 Mosquito/Fly Tracker + Laser Turret
; Target board: AI-Thinker ESP32-CAM (OV2640, cheap & widely available)
;
; Flashing note: the AI-Thinker board has no onboard USB-serial chip.
; You need an external FTDI/USB-TTL adapter wired to U0T/U0R/GND/5V,
; and GPIO0 must be tied to GND during flashing (remove the jumper /
; power-cycle after flashing to run normally).

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    madhephaestus/ESP32Servo @ ^3.0.5
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
